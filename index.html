<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCode - Live Python Online Editor</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 1. Monaco Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>

    <!-- 2. Pyodide WASM CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
    <header class="navbar">
        <h2>⚡ VibeCode Python Studio</h2>
        <div class="header-actions">
            <span id="auto-status" class="badge">⚡ Auto-Run: ON</span>
            <button id="run-btn" onclick="runPythonCode()">▶ Manual Run</button>
        </div>
    </header>

    <main class="container">
        <!-- Editor Box -->
        <div class="editor-box">
            <div class="box-header">
                <span>Python Source Code</span>
                <span class="lang-tag">Python 3.14</span>
            </div>
            <div id="editor"></div>
        </div>

        <!-- Terminal Box -->
        <div class="output-box">
            <div class="box-header">
                <span>Live Output Terminal</span>
                <button class="clear-btn" onclick="clearTerminal()">🧹 Clear Terminal</button>
            </div>
            <pre id="output">Step 1: HTML Page Loaded. Initializing Scripts...</pre>
        </div>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar">
        <span id="status-text">🟡 Starting Setup...</span>
        <span>UTF-8 | WebAssembly</span>
    </footer>

    <script src="app.js"></script>
</body>
</html>
