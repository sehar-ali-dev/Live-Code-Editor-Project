<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCode - Universal Multi-Language Studio</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Monaco Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>

    <!-- Pyodide WASM CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
    <header class="navbar">
        <h2>⚡ VibeCode Studio</h2>

        <!-- Language Selector Dropdown -->
        <div class="language-picker">
            <label for="language-select">Select Language:</label>
            <select id="language-select" onchange="changeLanguage()">
                <option value="python">🐍 Python 3.14 (WASM)</option>
                <option value="html">🌐 HTML / CSS / JS (Live Preview)</option>
                <option value="cpp">⚡ C++ (Browser Engine)</option>
                <option value="java">☕ Java (Browser Engine)</option>
                <option value="javascript">📜 JavaScript (Native Engine)</option>
            </select>
        </div>

        <!-- Theme Selector Dropdown -->
        <div class="theme-picker">
            <label for="theme-select">Theme:</label>
            <select id="theme-select" onchange="changeTheme()">
                <option value="vs-dark">🌙 VS Dark</option>
                <option value="vs-light">☀️ VS Light</option>
                <option value="hc-black">⚫ High Contrast</option>
            </select>
        </div>

        <!-- Font Size Selector -->
        <div class="font-size-picker">
            <label for="font-size-select">Font Size:</label>
            <select id="font-size-select" onchange="changeFontSize()">
                <option value="12">12px</option>
                <option value="14" selected>14px</option>
                <option value="18">18px</option>
                <option value="20">20px</option>
            </select>
        </div>

        <div class="header-actions">
            <span id="auto-status" class="badge">⚡ Auto-Run: ON</span>
            <button id="import-btn" onclick="document.getElementById('file-input').click()">📂 Import</button>
            <input type="file" id="file-input" accept=".py,.html,.cpp,.java,.js,.txt" style="display: none;" onchange="handleFileImport(event)">
            <button id="download-btn" onclick="downloadCode()">💾 Download</button>
            <button id="share-btn" onclick="shareCode()">🔗 Share</button>
            <button id="run-btn" onclick="runCode()">▶ Manual Run</button>
        </div>
    </header>

    <main class="container">
        <!-- Code Editor Box -->
        <div class="editor-box">
            <div class="box-header">
                <span>Source Code</span>
                <div class="box-header-actions">
                    <span id="lang-tag" class="lang-tag">PYTHON</span>
                    <button class="format-btn" onclick="formatCode()">✨ Format</button>
                </div>
            </div>
            
            <!-- HTML Multi-Tab Sub-Tabs (shown only in HTML mode) -->
            <div id="html-tabs" class="html-tabs" style="display: none;">
                <button class="html-tab active" data-tab="html" onclick="switchHtmlTab('html')">index.html</button>
                <button class="html-tab" data-tab="css" onclick="switchHtmlTab('css')">style.css</button>
                <button class="html-tab" data-tab="js" onclick="switchHtmlTab('js')">script.js</button>
            </div>
            
            <div id="editor"></div>
        </div>

        <!-- Output Box (Terminal + iFrame Web Preview) -->
        <div class="output-box">
            <div class="box-header">
                <span id="output-title">Live Terminal Output</span>
                <button class="clear-btn" onclick="clearTerminal()">🧹 Clear</button>
            </div>
            
            <!-- Output Mode 1: Text Terminal -->
            <pre id="output">🟢 Initializing VibeCode Studio...</pre>

            <!-- Output Mode 2: iFrame Live Web Preview -->
            <iframe id="web-preview" style="display: none;" sandbox="allow-scripts allow-modals"></iframe>
        </div>
    </main>

    <!-- Bottom Status Bar -->
    <footer class="status-bar">
        <span id="status-text">� Ready</span>
        <span id="execution-time"></span>
    </footer>

    <!-- Error Explanation Modal -->
    <div id="error-modal" class="error-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💡 Error Explanation</h2>
                <button class="modal-close" onclick="closeErrorModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="error-section">
                    <h3>❌ What Went Wrong</h3>
                    <p id="error-what"></p>
                </div>
                <div class="error-section">
                    <h3>🔍 Why It Happened</h3>
                    <p id="error-why"></p>
                </div>
                <div class="error-section">
                    <h3>✅ Suggested Fix</h3>
                    <pre id="error-fix"></pre>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" onclick="closeErrorModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
